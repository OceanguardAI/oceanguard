name: Deploy OceanGuard YOLO Service to Azure

on:
  push:
    branches: [main]
    paths:
      - "yolo-service/**"
      - ".github/workflows/deploy-yolo.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/og-yolo:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure for Students blocks ACR Tasks (az acr build), so the image is built
      # on the runner and pushed with the registry's admin credential.
      - name: Log in to the registry
        run: |
          password=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$password"
          echo "$password" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_NAME" --password-stdin

      - name: Build and push image
        run: |
          docker build -f yolo-service/Dockerfile -t "$IMAGE" yolo-service
          docker push "$IMAGE"

      # Azure Container Apps "express" environments require registry credentials in every
      # update request body; az containerapp update does not send them, so we use az rest.
      - name: Roll out new revision
        env:
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
        run: |
          SUB=$(az account show --query id -o tsv)
          ACR_PWD=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PWD"
          SPEC=$(az rest --method GET \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/og-yolo?api-version=2024-03-01" \
            --output json)
          ACR_SECRET_NAME="${ACR_NAME}azurecrio-${ACR_NAME}"
          echo "$SPEC" | jq \
            --arg img    "$IMAGE" \
            --arg acr    "$ACR_PWD" \
            --arg acrn   "$ACR_NAME" \
            --arg acrkey "$ACR_SECRET_NAME" \
            --arg shid   "$SENTINELHUB_CLIENT_ID" \
            --arg shsec  "$SENTINELHUB_CLIENT_SECRET" \
            '.properties.template.containers[0].image=$img |
             .properties.configuration.ingress.targetPort=8080 |
             .properties.configuration.registries=[{
               "server": ($acrn+".azurecr.io"),
               "username": $acrn,
               "passwordSecretRef": $acrkey
             }] |
             .properties.configuration.secrets|=(
               map(
                 if   .name=="ogacr901adazurecrio-ogacr901ad" then .value=$acr
                 elif .name=="sentinelhub-client-id"           then .value=$shid
                 elif .name=="sentinelhub-client-secret"       then .value=$shsec
                 else . end) |
               if map(select(.name=="sentinelhub-client-id"))|length==0
               then . + [{"name":"sentinelhub-client-id","value":$shid}] else . end |
               if map(select(.name=="sentinelhub-client-secret"))|length==0
               then . + [{"name":"sentinelhub-client-secret","value":$shsec}] else . end) |
             .properties.template.containers[0].env|=(
               (. // []) |
               map(
                 if   .name=="SENTINELHUB_CLIENT_ID"     then .secretRef="sentinelhub-client-id"
                 elif .name=="SENTINELHUB_CLIENT_SECRET" then .secretRef="sentinelhub-client-secret"
                 else . end) |
               if map(select(.name=="SENTINELHUB_CLIENT_ID"))|length==0
               then . + [{"name":"SENTINELHUB_CLIENT_ID","secretRef":"sentinelhub-client-id"}] else . end |
               if map(select(.name=="SENTINELHUB_CLIENT_SECRET"))|length==0
               then . + [{"name":"SENTINELHUB_CLIENT_SECRET","secretRef":"sentinelhub-client-secret"}] else . end)' > /tmp/spec.json
          az rest --method PUT \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/og-yolo?api-version=2024-03-01" \
            --body @/tmp/spec.json \
            --headers "Content-Type=application/json"
