name: Deploy OceanGuard YOLO Service to Azure

on:
  push:
    branches: [main]
    paths:
      - "yolo-service/**"
      - ".github/workflows/deploy-yolo.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Image is built inside Azure Container Registry; the Container App keeps
      # its secrets and environment, only the image changes.
      - name: Build image in ACR
        run: az acr build -r "$ACR_NAME" -t "og-yolo:${{ github.sha }}" -f yolo-service/Dockerfile yolo-service

      - name: Roll out new revision
        run: az containerapp update -n og-yolo -g "$RESOURCE_GROUP" --image "$ACR_NAME.azurecr.io/og-yolo:${{ github.sha }}"
