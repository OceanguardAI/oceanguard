name: Deploy OceanGuard YOLO Service to Azure

on:
  push:
    branches: [main]
    paths:
      - "yolo-service/**"
      - ".github/workflows/deploy-yolo.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/og-yolo:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure for Students blocks ACR Tasks (az acr build), so the image is built
      # on the runner and pushed with the registry's admin credential.
      - name: Log in to the registry
        run: |
          password=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$password"
          echo "$password" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_NAME" --password-stdin

      - name: Build and push image
        run: |
          docker build -f yolo-service/Dockerfile -t "$IMAGE" yolo-service
          docker push "$IMAGE"

      # The apps are first created with a placeholder image on port 80; this is
      # idempotent once the real image is running on 8080.
      - name: Roll out new revision
        run: |
          az containerapp ingress update -n og-yolo -g "$RESOURCE_GROUP" --target-port 8080
          az containerapp update -n og-yolo -g "$RESOURCE_GROUP" --image "$IMAGE"
