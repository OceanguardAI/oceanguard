name: Deploy OceanGuard Frontend to Azure

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/og-web:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure for Students blocks ACR Tasks (az acr build), so the image is built
      # on the runner and pushed with the registry's admin credential.
      - name: Log in to the registry
        run: |
          ACR_PASSWORD=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> "$GITHUB_ENV"
          echo "$ACR_PASSWORD" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_NAME" --password-stdin

      - name: Build and push image
        run: |
          docker build -f frontend/Dockerfile --build-arg "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" -t "$IMAGE" frontend
          docker push "$IMAGE"

      # The apps are first created with a placeholder image on port 80; this is
      # idempotent once the real image is running on 8080.
      - name: Roll out new revision
        run: |
          az containerapp ingress update -n og-web -g "$RESOURCE_GROUP" --target-port 8080
          az containerapp update -n og-web -g "$RESOURCE_GROUP" --image "$IMAGE" \
            --registry-server "$ACR_NAME.azurecr.io" \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_PASSWORD"
