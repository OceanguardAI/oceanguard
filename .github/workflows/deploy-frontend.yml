name: Deploy OceanGuard Frontend to Azure

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Image is built inside Azure Container Registry; the Container App keeps
      # its secrets and environment, only the image changes.
      - name: Build image in ACR
        run: az acr build -r "$ACR_NAME" -t "og-web:${{ github.sha }}" -f frontend/Dockerfile --build-arg "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" frontend

      - name: Roll out new revision
        run: az containerapp update -n og-web -g "$RESOURCE_GROUP" --image "$ACR_NAME.azurecr.io/og-web:${{ github.sha }}"
