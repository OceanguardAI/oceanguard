name: Deploy OceanGuard Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/og-backend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure for Students blocks ACR Tasks (az acr build), so the image is built
      # on the runner and pushed with the registry's admin credential.
      - name: Log in to the registry
        run: |
          password=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$password"
          echo "$password" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_NAME" --password-stdin

      - name: Build and push image
        run: |
          docker build -f backend/Dockerfile -t "$IMAGE" backend
          docker push "$IMAGE"

      # Registry credentials are stored on the app at creation time (azure_deploy.ps1).
      # This step only needs to update the image and fix the ingress port.
      - name: Roll out new revision
        run: |
          az containerapp ingress update -n og-backend -g "$RESOURCE_GROUP" --target-port 8080
          az containerapp update -n og-backend -g "$RESOURCE_GROUP" --image "$IMAGE"
