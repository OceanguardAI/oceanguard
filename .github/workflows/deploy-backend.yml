name: Deploy OceanGuard Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/og-backend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure for Students blocks ACR Tasks (az acr build), so the image is built
      # on the runner and pushed with the registry's admin credential.
      - name: Log in to the registry
        run: |
          password=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$password"
          echo "$password" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_NAME" --password-stdin

      - name: Build and push image
        run: |
          docker build -f backend/Dockerfile -t "$IMAGE" backend
          docker push "$IMAGE"

      # Azure Container Apps "express" environments require registry credentials in every
      # update request body; az containerapp update does not send them, so we use az rest.
      - name: Roll out new revision
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          SUB=$(az account show --query id -o tsv)
          ACR_PWD=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PWD"
          SPEC=$(az rest --method GET \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/og-backend?api-version=2024-03-01" \
            --output json)
          echo "$SPEC" | jq \
            --arg img "$IMAGE" \
            --arg acr  "$ACR_PWD" \
            --arg admin "$ADMIN_API_KEY" \
            --arg gfw   "$GFW_API_TOKEN" \
            --arg ais   "$AISSTREAM_API_KEY" \
            --arg groq  "$GROQ_API_KEY" \
            '.properties.template.containers[0].image=$img |
             .properties.configuration.ingress.targetPort=8080 |
             .properties.configuration.secrets|=map(
               if   .name=="ogacr901adazurecrio-ogacr901ad" then .value=$acr
               elif .name=="admin-key"  then .value=$admin
               elif .name=="gfw-token"  then .value=$gfw
               elif .name=="ais-key"    then .value=$ais
               elif .name=="groq-key"   then .value=$groq
               else . end)' > /tmp/spec.json
          az rest --method PUT \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/og-backend?api-version=2024-03-01" \
            --body @/tmp/spec.json \
            --headers "Content-Type=application/json"
